<style id="app-css">
:root{
  --verde:#2E6B4F;--verde-escuro:#1F4D38;--amarelo:#F5C542;--amarelo-sombra:#D9A21B;
  --fundo:#F7FAF8;--superficie:#FFFFFF;--texto:#1D2B26;--suave:#4A5A54;--borda:#D6E3DC;--verde-claro:#E6EFEA;
  --topo:#2E6B4F;--topo-texto:#FFFFFF;
  --serif:'Young Serif',Georgia,'Times New Roman',serif;
  --sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fundo:#12201A;--superficie:#1A2C24;--texto:#EEF4F0;--suave:#A9BDB3;--borda:#2D4439;--verde-claro:#22382E;
    --topo:#1F4D38;--verde:#3E8A66;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fundo:#12201A;--superficie:#1A2C24;--texto:#EEF4F0;--suave:#A9BDB3;--borda:#2D4439;--verde-claro:#22382E;
  --topo:#1F4D38;--verde:#3E8A66;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--sans);font-size:1.125rem;line-height:1.5}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- topo ---------- */
.topo{background:var(--topo);color:var(--topo-texto);padding:2.25rem 1.25rem 3.75rem;text-align:center;position:relative}
.retrato{position:relative;width:8.5rem;height:8.5rem;margin:0 auto 1.1rem}
.retrato img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #F7FAF8;background:#F7FAF8}
.retrato svg{position:absolute;right:-.35rem;bottom:-.1rem;width:3.1rem;height:3.1rem}
.marca{margin:0;line-height:1}
.marca .de{display:block;font-family:var(--sans);font-weight:700;font-size:1.5rem;color:var(--amarelo);letter-spacing:-.01em}
.marca .nome{display:block;font-family:var(--serif);font-weight:400;font-size:3.6rem;line-height:1;margin-top:.1rem;letter-spacing:-.01em}
.bio{max-width:30ch;margin:.9rem auto 0;font-size:1.0625rem;line-height:1.45;opacity:.92}
.redes{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin-top:1.1rem}
.redes a{display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;padding:.4rem 1rem;border-radius:999px;border:2px solid rgba(255,255,255,.55);text-decoration:none;font-weight:700;font-size:1rem}
.redes a svg{width:1.15rem;height:1.15rem}

/* ---------- ferramentas ---------- */
main{max-width:64rem;margin:0 auto;padding:0 1rem 2rem}
.busca{position:relative;margin:-1.75rem auto 0;max-width:34rem}
.busca input{width:100%;min-height:3.5rem;border-radius:1rem;border:2px solid var(--borda);background:var(--superficie);color:var(--texto);font:inherit;font-size:1.125rem;padding:.75rem 1rem .75rem 3rem;box-shadow:0 6px 18px rgba(20,50,36,.14)}
.busca input::placeholder{color:var(--suave)}
.busca svg{position:absolute;left:1rem;top:50%;transform:translateY(-50%);width:1.35rem;height:1.35rem;color:var(--suave);pointer-events:none}
.filtros{display:flex;gap:.5rem;overflow-x:auto;padding:1rem .1rem .25rem;scrollbar-width:none;max-width:34rem;margin:0 auto}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:none;min-height:2.75rem;padding:.4rem 1.05rem;border-radius:999px;border:2px solid var(--borda);background:var(--superficie);color:var(--texto);font:inherit;font-size:1rem;font-weight:700;cursor:pointer}
.filtros button[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff}

/* ---------- lista ---------- */
.lista{list-style:none;margin:1.25rem 0 0;padding:0;display:grid;gap:1rem}
.item{background:var(--superficie);border:1px solid var(--borda);border-radius:1.25rem;padding:.9rem;display:grid;grid-template-columns:8.25rem minmax(0,1fr);column-gap:1rem;row-gap:1.15rem;scroll-margin-top:1rem}
.item.destaque{outline:4px solid var(--amarelo);outline-offset:2px}
.foto{position:relative;display:block;aspect-ratio:1;border-radius:.9rem;background:#fff;align-self:start}
.foto img{width:100%;height:100%;object-fit:cover;border-radius:.9rem}
.foto .sem{width:100%;height:100%;border-radius:.9rem;background:var(--verde-claro);display:flex;align-items:center;justify-content:center;color:var(--verde)}
.foto .sem svg{width:45%;height:45%}
.etiqueta{position:absolute;left:-.4rem;bottom:-.55rem;background:var(--amarelo);color:#1D2B26;border-radius:.6rem;padding:.3rem .6rem .3rem 1.45rem;font-weight:700;font-size:1.0625rem;line-height:1.1;white-space:nowrap;transform:rotate(-6deg);box-shadow:0 2px 0 var(--amarelo-sombra)}
.etiqueta::before{content:"";position:absolute;left:.5rem;top:50%;width:.5rem;height:.5rem;margin-top:-.25rem;border-radius:50%;background:var(--superficie)}
.info{min-width:0;display:flex;flex-direction:column;gap:.3rem}
.num{font-weight:700;font-size:.9375rem;color:var(--verde)}
.item h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.25rem;line-height:1.22;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.antigo{margin:0;font-size:1rem;color:var(--suave)}
.antigo s{text-decoration-thickness:2px}
.frase{margin:.15rem 0 0;font-style:italic;font-size:1rem;line-height:1.4;color:var(--texto)}
.comprar{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.4rem;border-radius:.9rem;background:var(--verde);color:#fff;text-decoration:none;font-weight:700;font-size:1.1875rem}
.comprar:active{background:var(--verde-escuro)}
.comprar svg{width:1.25rem;height:1.25rem}
.editar-item{grid-column:1 / -1;justify-self:end;margin-top:-.4rem;background:none;border:0;color:var(--suave);font:inherit;font-size:1rem;font-weight:700;text-decoration:underline;padding:.4rem .2rem;cursor:pointer}

.aviso-vazio{text-align:center;max-width:26rem;margin:2.5rem auto;color:var(--suave)}
.aviso-vazio strong{display:block;font-family:var(--serif);font-weight:400;font-size:1.5rem;color:var(--texto);margin-bottom:.4rem}

footer{max-width:34rem;margin:0 auto;padding:1rem 1.25rem 2.5rem;text-align:center;font-size:.9375rem;color:var(--suave)}
footer p{margin:.4rem 0}
.sem-edicao footer{padding-bottom:2.5rem}

/* ---------- barra da dona ---------- */
.barra{position:fixed;left:0;right:0;bottom:0;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px));background:var(--superficie);border-top:1px solid var(--borda);display:flex;gap:.6rem;justify-content:center;z-index:5}
.barra[hidden]{display:none}
.btn{min-height:3.25rem;padding:.6rem 1.2rem;border-radius:.9rem;font:inherit;font-weight:700;font-size:1.0625rem;cursor:pointer;border:2px solid transparent}
.btn-principal{background:var(--amarelo);color:#1D2B26;border-color:var(--amarelo)}
.btn-secundario{background:transparent;color:var(--texto);border-color:var(--borda)}
.btn[disabled]{opacity:.6;cursor:progress}
.barra .btn-principal{flex:1;max-width:22rem}

/* ---------- folha de edição ---------- */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:36rem;max-height:92vh;border-radius:1.5rem 1.5rem 0 0;background:var(--superficie);color:var(--texto)}
dialog::backdrop{background:rgba(18,32,26,.55)}
.folha{padding:1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1rem}
.folha h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.75rem;line-height:1.15}
.campo{display:flex;flex-direction:column;gap:.35rem}
.campo label,.campo .rotulo{font-weight:700;font-size:1rem}
.campo small{color:var(--suave);font-size:.9375rem;line-height:1.4}
.campo input,.campo textarea{width:100%;font:inherit;font-size:1.0625rem;color:var(--texto);background:var(--fundo);border:2px solid var(--borda);border-radius:.8rem;padding:.7rem .85rem;min-height:3.1rem}
.campo textarea{resize:vertical;min-height:5.5rem}
.campo input:focus,.campo textarea:focus{border-color:var(--verde);outline:none}
.colar{background:var(--verde-claro);border-radius:1rem;padding:1rem}
.colar textarea{background:var(--superficie)}
.lido{margin:0;font-size:.9375rem;font-weight:700;color:var(--verde)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.foto-campo{display:flex;gap:.9rem;align-items:center}
.foto-previa{width:6rem;height:6rem;flex:none;border-radius:.8rem;background:var(--verde-claro);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--verde)}
.foto-previa img{width:100%;height:100%;object-fit:cover}
.foto-previa svg{width:2.5rem;height:2.5rem}
.foto-botao{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.foto-botao input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.acoes{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.25rem}
.acoes .btn-principal{flex:1 1 12rem}
.apagar{background:none;border:0;color:var(--suave);font:inherit;font-weight:700;text-decoration:underline;padding:.6rem 0;cursor:pointer;align-self:flex-start}
.apagar.confirmar{color:#C62F3B}
.msg{margin:0;font-weight:700;font-size:1rem}
.msg.erro{color:#C62F3B}
.msg:empty{display:none}

@media (min-width:40rem){
  .topo{padding:3rem 1.5rem 4.25rem}
  .marca .nome{font-size:4.5rem}
  .lista{grid-template-columns:repeat(2,minmax(0,1fr))}
  dialog{margin:auto;border-radius:1.5rem}
}
@media (min-width:62rem){
  .lista{grid-template-columns:repeat(3,minmax(0,1fr))}
  .item{grid-template-columns:1fr}
  .item .foto{width:100%}
}
@media (prefers-reduced-motion:no-preference){
  .item.destaque{animation:pisca 1.6s ease-out 1}
  @keyframes pisca{0%{outline-color:transparent}20%{outline-color:var(--amarelo)}}
}
</style>
</head>

<script id="app-js">
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("dados").textContent);
  D.perfil = D.perfil || {};
  D.produtos = D.produtos || [];
  D.proximo = D.proximo || 1;

  var tpl = document.getElementById("t-corpo");
  document.body.insertBefore(tpl.content.cloneNode(true), tpl);
  document.body.classList.add("sem-edicao");

  var $ = function(id){ return document.getElementById(id); };
  var estado = { cat: "Todos", busca: "", edita: false, art: null, fotoNova: undefined, editando: null };

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function linkSeguro(u){ u = String(u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
  function preco(p){ p = String(p || "").replace(/R\$\s*/i, "").trim(); return p ? "R$ " + p : ""; }

  var ICO = {
    casa: '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#2E6B4F" stroke="#F7FAF8" stroke-width="6"></circle><path d="M29 51 L50 32 L71 51" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M35 47 V71 H65 V47" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path><path d="M41 58 L48 65 L60 52" fill="none" stroke="#F5C542" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
    casaLinha: '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M20 50 L50 24 L80 50" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M28 45 V78 H72 V45" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M39 61 L47 69 L62 54" fill="none" stroke="#F5C542" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path></svg>',
    sacola: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>',
    insta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"></circle></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"></path><path d="M14 3c.4 2.6 2.2 4.4 5 4.6"></path></svg>',
    whats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-4A8 8 0 1 1 8.4 19L4 20z"></path></svg>'
  };

  /* ---------- topo ---------- */
  function desenharTopo(){
    var p = D.perfil, h = "";
    h += '<div class="retrato">' + (p.foto ? '<img src="' + esc(p.foto) + '" alt="Foto da Márcia" width="136" height="136">' : "") + ICO.casa + "</div>";
    h += '<h1 class="marca"><span class="de">achadinhos da</span><span class="nome">Márcia</span></h1>';
    if (p.bio) h += '<p class="bio">' + esc(p.bio) + "</p>";
    var redes = [["insta","Instagram",ICO.insta],["tiktok","TikTok",ICO.tiktok],["whats","Grupo no WhatsApp",ICO.whats]]
      .filter(function(r){ return linkSeguro(p[r[0]]); });
    if (redes.length){
      h += '<nav class="redes" aria-label="Redes sociais">' + redes.map(function(r){
        return '<a href="' + esc(linkSeguro(p[r[0]])) + '" target="_blank" rel="noopener">' + r[2] + esc(r[1]) + "</a>";
      }).join("") + "</nav>";
    }
    $("topo").innerHTML = h;
  }

  /* ---------- lista ---------- */
  function categorias(){
    var s = [];
    D.produtos.forEach(function(p){ var c = (p.cat || "").trim(); if (c && s.indexOf(c) < 0) s.push(c); });
    return s.sort(function(a,b){ return a.localeCompare(b, "pt-BR"); });
  }
  function desenharFiltros(){
    var cats = categorias(), box = $("filtros");
    if (cats.length < 2){ box.hidden = true; estado.cat = "Todos"; return; }
    if (estado.cat !== "Todos" && cats.indexOf(estado.cat) < 0) estado.cat = "Todos";
    box.hidden = false;
    box.innerHTML = ["Todos"].concat(cats).map(function(c){
      return '<button type="button" aria-pressed="' + (c === estado.cat) + '" data-cat="' + esc(c) + '">' + esc(c) + "</button>";
    }).join("");
  }
  function normal(s){ return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function visiveis(){
    var q = normal(estado.busca).replace(/^n[ºo°.]?\s*/, "").trim();
    return D.produtos.slice().sort(function(a,b){ return b.n - a.n; }).filter(function(p){
      if (estado.cat !== "Todos" && (p.cat || "").trim() !== estado.cat) return false;
      if (!q) return true;
      if (/^\d+$/.test(q)) return String(p.n) === q;
      return normal(p.nome + " " + (p.cat || "") + " " + (p.frase || "")).indexOf(q) >= 0;
    });
  }
  function cartao(p){
    var link = esc(linkSeguro(p.link));
    var h = '<li class="item" id="n' + p.n + '">';
    h += '<a class="foto" href="' + link + '" target="_blank" rel="sponsored noopener" tabindex="-1" aria-hidden="true">';
    h += p.foto ? '<img src="' + esc(p.foto) + '" alt="" loading="lazy" width="264" height="264">' : '<span class="sem">' + ICO.casaLinha + "</span>";
    if (p.preco) h += '<span class="etiqueta">' + esc(preco(p.preco)) + "</span>";
    h += "</a><div class=\"info\">";
    h += '<span class="num">nº ' + p.n + "</span>";
    h += "<h2>" + esc(p.nome) + "</h2>";
    if (p.antigo) h += '<p class="antigo">de <s>' + esc(preco(p.antigo)) + "</s></p>";
    if (p.frase) h += '<p class="frase">“' + esc(p.frase) + "”</p>";
    h += "</div>";
    h += '<a class="comprar" href="' + link + '" target="_blank" rel="sponsored noopener">' + ICO.sacola + 'Ver na Shopee<span class="sr">: ' + esc(p.nome) + (p.preco ? ", " + esc(preco(p.preco)) : "") + "</span></a>";
    return h + "</li>";
  }
  function desenharLista(){
    var itens = visiveis(), vazio = $("vazio");
    $("lista").innerHTML = itens.map(cartao).join("");
    if (itens.length){ vazio.hidden = true; return; }
    vazio.hidden = false;
    if (!D.produtos.length){
      vazio.innerHTML = "<strong>Os primeiros achadinhos chegam em breve</strong>Volte daqui a pouquinho.";
    } else {
      vazio.innerHTML = "<strong>Nada encontrado</strong>Tente outra palavra ou o número que apareceu no vídeo.";
    }
  }
  function desenhar(){ desenharTopo(); desenharFiltros(); desenharLista(); }

  $("q").addEventListener("input", function(e){ estado.busca = e.target.value; desenharLista(); });
  $("filtros").addEventListener("click", function(e){
    var b = e.target.closest("button[data-cat]"); if (!b) return;
    estado.cat = b.getAttribute("data-cat"); desenharFiltros(); desenharLista();
  });

  desenhar();

  function irParaHash(){
    var m = /^#n?(\d+)$/.exec(location.hash || ""); if (!m) return;
    var el = $("n" + m[1]); if (!el) return;
    el.classList.add("destaque");
    el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  irParaHash();

})();
</script>
