<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E6B4F">
<meta name="robots" content="noindex">
<title>Página não encontrada · Achadinhos da Márcia</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#2E6B4F;--amarelo:#F5C542;--fundo:#F7FAF8;--texto:#1D2B26;--suave:#4A5A54}
@media (prefers-color-scheme:dark){:root{--fundo:#12201A;--texto:#EEF4F0;--suave:#A9BDB3}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--fundo);color:var(--texto);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;text-align:center}
img{width:88px;height:88px}
h1{font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:clamp(28px,7vw,40px);margin:18px 0 8px}
p{color:var(--suave);font-size:18px;line-height:1.5;margin:0 auto 26px;max-width:32ch}
a{display:inline-block;background:var(--verde);color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:14px 26px;border-radius:999px;box-shadow:0 4px 0 #1F4D38}
a:focus-visible{outline:3px solid var(--amarelo);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="">
  <h1>Ops, essa página não existe</h1>
  <p>O achadinho que você procura pode ter saído da lista. Veja todos os produtos na página inicial.</p>
  <a href="/">Ver os achadinhos</a>
</main>
</body>
</html>
